# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.

name: Stable 0-Day PR Info

#
# WARNING:
#    ** Do NOT run untrusted code when using pull_request_target **
# pull_request_target is needed as pull_request does not provide secrets and so no
# labeling of PR is possible.
#
on:
  pull_request_target:
    types: [labeled, unlabeled]
  # Dispatched by src/check.mts, which adds the label with the default GITHUB_TOKEN - an event
  # from that token does not start the 'labeled' run, so the PR number is passed explicitly here.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to process'
        required: true

jobs:
  stableBrandNewInfo:
    name: stable 0-day PR info
    if: |
      github.repository == 'ioBroker/ioBroker.repositories'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm i
      - run: npm run stable0DayPrInfo
        env:
          OWN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr }}
